name: myqr_getx
description: QR Generator-Scanner with EMVCO support (GetX architecture).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  qr_code_tools: ^0.2.0
  rxdart: ^0.28.0
  fluttertoast: ^8.2.12
  share_plus: ^11.0.0
  screenshot: ^3.0.0
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.8.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  dart_amqp: ^0.3.1
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/qr.png
    - assets/images/qrembed.png
    - assets/images/asthalogo.jpeg
    - assets/images/logo.png
  fonts:
    - family: cambria
      fonts:
        - asset: assets/font/cambria.ttf
